<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html {
        background: #faf9f6;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        background: #191a19;
        color-scheme: dark;
      }
    </style>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("portfolio:theme");
        } catch {
          /* Storage is optional. */
        }
        document.documentElement.dataset.theme =
          theme === "light" || theme === "dark"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nihit Sunhare builds Linux tools and dotfiles on Arch Linux with Hyprland, Zsh, Kitty, Starship, Neovim, and Podman."
    />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      property="og:title"
      content="Nihit Sunhare — Linux · Terminal · Developer Tools"
    />
    <meta
      property="og:description"
      content="Arch Linux, Hyprland, Zsh, Kitty, Starship, Neovim, Podman, and developer experiments by Nihit Sunhare."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nihit.is-a.dev" />

    <meta
      property="og:image:alt"
      content="Nihit Sunhare — Linux, terminal and developer tools"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="color-scheme" content="light dark" />
    <meta name="twitter:card" content="summary_large_image" />

    />
